version: "3.1"

intents:
  - greet
  - thank
  - goodbye
  - ask_player_info
  - ask_team_squad
  - ask_player_position
  - ask_player_nationality
  - ask_player_stats
  - out_of_scope

entities:
  - player_name
  - team_name

slots:
  player_name:
    type: text
    mappings:
      - type: from_entity
        entity: player_name
  team_name:
    type: text
    mappings:
      - type: from_entity
        entity: team_name

responses:
  utter_greet:
    - text: "Hi, I'm Raza. You can ask me a football question, or you can play a football quiz."
    - text: "Hey, I'm Raza. Ask me about football data, or you can play a football quiz."
    - text: "Hello, I'm Raza. I can answer 2024/25 football dataset questions, or you can play a football quiz."
    - text: "Hi there. You can ask about football data, or play the football quiz."
  utter_goodbye:
    - text: "See you!"
    - text: "Thanks for the chat. See you next time."
    - text: "All right, speak soon."
  utter_thanks:
    - text: "You're welcome."
    - text: "No problem."
    - text: "Any time."
  utter_out_of_scope:
    - text: "I can stay useful on football questions for now. Try a player, team, league, or say quiz."
    - text: "That is outside my football dataset, but I can answer player and squad questions."
    - text: "I don't have that topic covered yet. Football data and the quiz are my strong areas."
  utter_ask_rephrase:
    - text: "I did not catch that. Could you ask with a player or team name?"
    - text: "Could you rephrase that with the player or club name?"
    - text: "I'm not sure which football item you mean. Try the full player or team name."

actions:
  - action_player_info
  - action_team_squad
  - action_player_position
  - action_player_nationality
  - action_player_stats

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
