version: "3.1"

rules:
  - rule: Greet user
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Close after thanks
    steps:
      - intent: thank
      - action: utter_thanks

  - rule: Answer player info
    steps:
      - intent: ask_player_info
      - action: action_player_info

  - rule: Answer team squad
    steps:
      - intent: ask_team_squad
      - action: action_team_squad

  - rule: Answer player position
    steps:
      - intent: ask_player_position
      - action: action_player_position

  - rule: Answer player nationality
    steps:
      - intent: ask_player_nationality
      - action: action_player_nationality

  - rule: Answer player stats
    steps:
      - intent: ask_player_stats
      - action: action_player_stats

  - rule: Handle out of scope
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope

  - rule: Fallback
    steps:
      - intent: nlu_fallback
      - action: utter_ask_rephrase
